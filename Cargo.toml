[workspace]
resolver = "3"
members = ["crates/rbus-wire", "crates/rbus", "crates/rbus-macros", "crates/rbus-testkit"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/PrintPractical/rbus-rs"
license = "Apache-2.0"
keywords = ["rdk", "rbus", "rtrouted", "tr-181", "ipc"]
categories = ["network-programming", "asynchronous", "embedded"]
publish = true

# Every dependency is declared once, here; crates add features on top.
# The internal crates carry a version too, for publishing. rbus-macros is
# pinned exactly: its output names rbus internals that only match the same
# release.
[workspace.dependencies]
rbus-macros = { path = "crates/rbus-macros", version = "=0.0.1" }
rbus-testkit = { path = "crates/rbus-testkit" }
rbus-wire = { path = "crates/rbus-wire", version = "0.0.1" }

bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
indexmap = "2"
proc-macro2 = "1"
proptest = "1"
quote = "1"
rmp = "0.8"
serde = "1"
serde_json = "1"
syn = "2"
thiserror = "2"
time = "0.3"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
