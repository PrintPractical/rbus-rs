[workspace]
resolver = "3"
members = ["crates/rbus-wire", "crates/rbus", "crates/rbus-macros", "crates/rbus-testkit"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/PrintPractical/rbus-rs"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
