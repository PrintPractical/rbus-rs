name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # rbus without its default features (no macros).
  no-default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rbus --no-default-features --lib -- -D warnings
      - run: cargo test -p rbus --no-default-features --lib
      - run: cargo test -p rbus --no-default-features --doc
      - run: cargo doc -p rbus --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The published crates package and build from their tarballs. The
  # workspace keeps publish = false until a release; this checkout flips it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sed -i 's/^publish = false$/publish = true/' Cargo.toml
      - run: cargo package --workspace --exclude rbus-testkit --allow-dirty

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # Unit + interop tests against the real rtrouted (built from the pinned
  # third_party/rbus submodule), run under cargo-llvm-cov.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/interop/Containerfile
          tags: rbus-rs-interop
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Interop tests with coverage (gate: 90% lines of rbus-wire and rbus)"
        run: scripts/interop.sh coverage
        env:
          INTEROP_SKIP_BUILD: "1"
          COVERAGE_FAIL_UNDER: "90"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/interop/lcov.info
          if-no-files-found: error
