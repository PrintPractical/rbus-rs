[package]
name = "rbus"
description = "Async, unsafe-free Rust client and provider for RDK's RBUS, speaking the rtrouted wire protocol directly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
indexmap = "2"
rbus-macros = { path = "../rbus-macros", optional = true }
rbus-wire = { path = "../rbus-wire" }
serde = "1"
thiserror = "2"
time = { version = "0.3", optional = true }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
rbus-testkit = { path = "../rbus-testkit" }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[features]
default = ["macros"]
## Re-exports the `rbus-macros` proc macros.
macros = ["dep:rbus-macros"]
## `RbusType` for `time::OffsetDateTime` (RBUS DateTime values).
time = ["dep:time"]

[lints]
workspace = true
