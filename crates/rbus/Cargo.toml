[package]
name = "rbus"
description = "Async, unsafe-free Rust client and provider for RDK's RBUS, speaking the rtrouted wire protocol directly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
license.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
futures-core.workspace = true
indexmap.workspace = true
rbus-macros = { workspace = true, optional = true }
rbus-wire.workspace = true
serde.workspace = true
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
rbus-testkit.workspace = true
serde = { workspace = true, features = ["derive"] }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trybuild.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }

[features]
default = ["macros"]
## Re-exports the `rbus-macros` proc macros.
macros = ["dep:rbus-macros"]
## `RbusType` for `time::OffsetDateTime` (RBUS DateTime values).
time = ["dep:time"]

[lints]
workspace = true
